server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:nexushr;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: nexushrsecretkeynexushrsecretkey123456
  expiration: 86400000

ai:
  provider:
    url: ${AI_PROVIDER_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}